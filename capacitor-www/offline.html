<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RAKVIH Originals</title>
    <style>
      :root {
        --gold: #e8c766;
        --gold-light: #f7e3a1;
        --gold-deep: #b8862d;
        --text: #f4efe3;
        --muted: #a39d8f;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html, body { height: 100%; margin: 0; background: #000; }

      body {
        color: var(--text);
        font-family: Georgia, "Noto Serif", serif;
        user-select: none;
        -webkit-user-select: none;
      }

      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 28px 32px;
        text-align: center;
        background: radial-gradient(circle at 50% 42%, rgba(232, 199, 102, 0.13), transparent 58%);
      }

      .logo {
        width: 64px;
        height: 64px;
        mix-blend-mode: screen;
        animation: rise 0.6s ease-out both;
      }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 340px;
      }

      .signal {
        position: relative;
        width: 104px;
        height: 104px;
        margin-bottom: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(232, 199, 102, 0.55);
        border-radius: 50%;
        background: rgba(232, 199, 102, 0.06);
        animation: rise 0.6s 0.08s ease-out both;
      }

      .signal::before,
      .signal::after {
        content: "";
        position: absolute;
        inset: -1px;
        border: 1px solid var(--gold);
        border-radius: 50%;
        opacity: 0;
        animation: ripple 3s ease-out infinite;
      }

      .signal::after { animation-delay: 1.5s; }

      .signal svg { width: 44px; height: 44px; stroke: var(--gold); }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--gold);
        font-family: system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        animation: rise 0.6s 0.14s ease-out both;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 31px;
        font-weight: 400;
        line-height: 1.2;
        animation: rise 0.6s 0.2s ease-out both;
      }

      .message {
        min-height: 72px;
        margin: 0 0 30px;
        color: var(--muted);
        font-family: system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        animation: rise 0.6s 0.26s ease-out both;
      }

      button {
        width: 100%;
        max-width: 280px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        border-radius: 2px;
        color: #1a1305;
        background: linear-gradient(115deg, var(--gold-deep), var(--gold) 45%, var(--gold-light) 70%, var(--gold));
        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: transform 0.15s ease, opacity 0.2s ease;
        animation: rise 0.6s 0.32s ease-out both;
      }

      button:active { transform: scale(0.98); }

      button:disabled { opacity: 0.75; }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(26, 19, 5, 0.3);
        border-top-color: #1a1305;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      button:disabled .spinner { display: block; }

      .status {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 28px 0 0;
        color: var(--muted);
        font-family: system-ui, sans-serif;
        font-size: 12px;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
        animation: blink 1.6s ease-in-out infinite;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }

      @keyframes ripple {
        from { opacity: 0.6; transform: scale(1); }
        to { opacity: 0; transform: scale(1.65); }
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      @keyframes blink { 50% { opacity: 0.25; } }

      @media (max-height: 560px) {
        main { padding-top: 20px; padding-bottom: 16px; }
        .logo { width: 44px; height: 44px; }
        .signal { width: 72px; height: 72px; margin-bottom: 16px; }
        .signal svg { width: 32px; height: 32px; }
        h1 { font-size: 25px; margin-bottom: 8px; }
        .message { min-height: 0; margin-bottom: 16px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="logo.png" alt="RAKVIH Originals" />

      <div class="content">
        <div class="signal" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h.01" />
            <path d="M8.5 16.429a5 5 0 0 1 7 0" />
            <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
            <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
            <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
            <path d="m2 2 20 20" />
          </svg>
        </div>

        <p class="eyebrow" id="eyebrow">No connection</p>
        <h1 id="title">You're offline</h1>
        <p class="message" id="message" aria-live="polite">Please check your Wi-Fi or mobile data. Everything will be right here when you're back online.</p>

        <button id="retry" type="button">
          <span class="spinner"></span>
          <span id="retry-label">Try again</span>
        </button>

        <p class="status" id="status"><span class="dot"></span>Reconnecting automatically</p>
      </div>
    </main>

    <script>
      var DEFAULT_MESSAGE = document.getElementById("message").textContent;
      var message = document.getElementById("message");
      var button = document.getElementById("retry");
      var label = document.getElementById("retry-label");

      function setChecking(checking) {
        button.disabled = checking;
        label.textContent = checking ? "Checking" : "Try again";
      }

      window.onOfflineShown = function () {
        setChecking(false);
        message.textContent = DEFAULT_MESSAGE;
      };

      window.onStillOffline = function () {
        setChecking(false);
        message.textContent = "Still no connection. Please check your Wi-Fi or mobile data and try again.";
      };

      button.addEventListener("click", function () {
        setChecking(true);
        if (window.RakvihNetwork) {
          window.RakvihNetwork.retry();
        } else {
          location.href = "https://rakvihoriginals.vercel.app";
        }
      });

      // The app's offline screen has RakvihNetwork. Without it, this page is the fallback
      // for a page that failed to load, which can also happen while online.
      if (!window.RakvihNetwork) {
        document.getElementById("eyebrow").textContent = "Something went wrong";
        document.getElementById("title").textContent = "This page couldn't load";
        message.textContent = "Please try again to return to the store.";
        document.getElementById("status").style.display = "none";
        document.querySelector(".signal").style.display = "none";
      }
    </script>
  </body>
</html>
